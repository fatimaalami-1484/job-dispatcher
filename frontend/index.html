<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobMesh</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>JobMesh</h1>
                <p>Distributed Job Execution Platform</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Central Server
            </div>
        </header>


        <section class="grid">

            <!-- Create Job -->
            <div class="card">

                <h2>Create Job</h2>

                <form id="createJobForm">

                    <div class="form-group">
                        <label for="agentId">Agent</label>

                        <select id="agentId" required>
                            <option value="agent-1">Agent 1</option>
                            <option value="agent-2">Agent 2</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="fileName">File Name</label>

                        <input
                            type="text"
                            id="fileName"
                            placeholder="test.js"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="timeout">Timeout (seconds)</label>

                        <input
                            type="number"
                            id="timeout"
                            value="30"
                            min="1"
                            required
                        >
                    </div>


                    <button type="submit">
                        Create Job
                    </button>

                </form>

                <div id="createMessage" class="message"></div>

            </div>


            <!-- Job Status -->
            <div class="card">

                <h2>Job Status</h2>

                <div class="search-box">

                    <input
                        type="number"
                        id="jobId"
                        placeholder="Enter Job ID"
                    >

                    <button id="getJobButton">
                        Get Job
                    </button>

                </div>


                <div id="jobResult" class="job-result">

                    <div class="empty-state">
                        Enter a Job ID to view its status.
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="./js/app.js"></script>

</body>

</html>
